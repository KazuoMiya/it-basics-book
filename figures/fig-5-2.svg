<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="ネットショップのER図。会員と注文、注文と注文明細、商品と注文明細が、それぞれ1対多で結ばれている" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><text x="16" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">ER図は、エンティティ（箱）と、その間の数の対応（線の端の記号）を描く</text><text x="16" y="62" font-size="11.5" fill="var(--cds-text-secondary)">PK＝主キー、FK＝外部キー。注文明細の主キーは、注文番号と商品番号の組（複合キー）。</text><g><rect x="16" y="92" width="150" height="102" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M16 122V96a4 4 0 0 1 4 -4H162a4 4 0 0 1 4 4V122z" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="91" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">会員</text><g><text x="26" y="139" font-size="12.5" fill="var(--cds-text-primary)">会員番号</text><text x="158" y="139" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">PK</text></g><g><text x="26" y="163" font-size="12.5" fill="var(--cds-text-primary)">氏名</text></g><g><text x="26" y="187" font-size="12.5" fill="var(--cds-text-primary)">都道府県</text></g></g><g><rect x="210" y="92" width="150" height="102" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M210 122V96a4 4 0 0 1 4 -4H356a4 4 0 0 1 4 4V122z" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="285" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">注文</text><g><text x="220" y="139" font-size="12.5" fill="var(--cds-text-primary)">注文番号</text><text x="352" y="139" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">PK</text></g><g><text x="220" y="163" font-size="12.5" fill="var(--cds-text-primary)">注文日</text></g><g><text x="220" y="187" font-size="12.5" fill="var(--cds-text-primary)">会員番号</text><text x="352" y="187" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">FK</text></g></g><g><rect x="404" y="92" width="150" height="126" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M404 122V96a4 4 0 0 1 4 -4H550a4 4 0 0 1 4 4V122z" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="479" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">注文明細</text><g><text x="414" y="139" font-size="12.5" fill="var(--cds-text-primary)">注文番号</text><text x="546" y="139" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">PK・FK</text></g><g><text x="414" y="163" font-size="12.5" fill="var(--cds-text-primary)">商品番号</text><text x="546" y="163" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">PK・FK</text></g><g><text x="414" y="187" font-size="12.5" fill="var(--cds-text-primary)">数量</text></g><g><text x="414" y="211" font-size="12.5" fill="var(--cds-text-primary)">注文時の単価</text></g></g><g><rect x="598" y="92" width="150" height="102" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M598 122V96a4 4 0 0 1 4 -4H744a4 4 0 0 1 4 4V122z" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="673" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">商品</text><g><text x="608" y="139" font-size="12.5" fill="var(--cds-text-primary)">商品番号</text><text x="740" y="139" text-anchor="end" font-size="11" fill="var(--cds-text-se