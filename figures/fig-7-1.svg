<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="共通鍵暗号は同じ鍵を共有し、公開鍵暗号は閉める鍵と開ける鍵を分ける" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="key-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">共通鍵暗号は同じ鍵を共有し、公開鍵暗号は閉める鍵と開ける鍵を分ける</text><g><rect x="24" y="56" width="712" height="152" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="40" y="82" font-size="14" font-weight="600" fill="var(--cds-text-primary)">共通鍵暗号（例：AES）</text><text x="720" y="82" text-anchor="end" font-size="12.5" fill="var(--cds-text-secondary)">閉める鍵と開ける鍵が同じ</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><rect x="40" y="96" width="128" height="56" rx="8"></rect><rect x="296" y="96" width="168" height="56" rx="8"></rect><rect x="592" y="96" width="128" height="56" rx="8"></rect></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M168 124H296" marker-end="url(#key-arrow)"></path><path d="M464 124H592" marker-end="url(#key-arrow)"></path></g><text x="104" y="120" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">平文</text><text x="104" y="138" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">送り手の手元</text><text x="380" y="120" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">暗号文</text><text x="380" y="138" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">途中で見られても読めない</text><text x="656" y="120" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">平文</text><text x="656" y="138" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">受け手が読める</text><text x="232" y="116" text-anchor="middle" font-size="12" fill="var(--cds-text-secondary)">暗号化</text><text x="528" y="116" text-anchor="middle" font-size="12" fill="var(--cds-text-secondary)">復号</text><g><line x1="232" x2="232" y1="126" y2="140" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" stroke-dasharray="3 3"></line><rect x="196" y="140" width="72" height="26" rx="13" fill="var(--cds-chart-categorical-1)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect></g><g><line x1="528" x2="528" y1="126" y2="140" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" stroke-dasharray="3 3"></line><rect x="492" y="140" width="72" height="26" rx="13" fill="var(--cds-chart-categorical-1)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect></g><text x="232" y="157" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">共通鍵</text><text x="528" y="157" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">共通鍵</text><text x="40" y="192" font-size="12.5" fill="var(--cds-text-primary)">課題：同じ鍵を、事前に相手へ安全に渡す必要がある（鍵配送問題）</text></g><g><rect x="24" y="224" width="712" height="152" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="40" y="250" font-size="14" font-weight="600" fill="var(--cds-text-primary)">公開鍵による暗号化（例：RSA-OAEP）</text><text x="720" y="250" text-anchor="end" font-size="12.5" fill="var(--cds-text-secondary)">閉める鍵と開ける鍵が別</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><rect x="40" y="264" width="128" height="56" rx="8"></rect><rect x="296" y="264" width="168" height="56" rx="8"></rect><rect x="592" y="264" width="128" height="56" rx="8"></rect></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M168 292H296" marker-end="url(#key-arrow)"></path><path d="M464 292H592" marker-end="url(#key-arrow)"></path></g><text x="104" y="288" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">平文</text><text x="104" y="306" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">送り手の手元</text><text x="380" y="288" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">暗号文</text><text x="380" y="306" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">途中で見られても読めない</text><text x="656" y="288" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">平文</text><text x="656" y="306" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">受け手が読める</text><text x="232" y="284" text-anchor="middle" font-size="12" fill="var(--cds-text-secondary)">暗号化</text><text x="528" y="284" text-anchor="middle" font-size="12" fill="var(--cds-text-secondary)">復号</text><g><line x1="232" x2="232" y1="294" y2="308" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25" stroke-dasharray="3 3"></line><rect x="178" y="308" width="108" height="26" rx="13" fill="var(--cds-chart-categorical-2)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-2)" stroke-width="1.5"></rect></g><g><line x1="528" x2="528" y1="294" y2="308" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25" stroke-dasharray="3 3"></line><rect x="474" y="308" width="108" height="26" rx="13" fill="var(--cds-chart-categorical-3)" fill-opacity="0.15" stroke="var(--cds-chart-categorical-3)" stroke-width="1.5"></rect></g><text x="232" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">受け手の公開鍵</text><text x="528" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">受け手の秘密鍵</text><text x="40" y="360" font-size="12.5" fill="var(--cds-text-primary)">公開鍵は誰に配ってもよい。開けられるのは、秘密鍵を持つ受け手だけ</text></g></svg>
