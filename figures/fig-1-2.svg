<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="CPUは番地を指定し、バスを通じてメモリとデータをやりとりする" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="f12-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">CPUは番地を指定し、バスを通じてメモリとデータをやりとりする</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">読み出しの例：CPUがメモリの1000番地の中身を読む</text><g><rect x="24" y="80" width="208" height="240" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="128" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">CPU</text></g><g><rect x="40" y="124" width="176" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="128" y="154" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">制御装置</text><text x="128" y="172" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">番地と合図を送る</text></g><g><rect x="40" y="244" width="176" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="128" y="265" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">レジスター</text><text x="128" y="283" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">受け取った値を置く</text></g><g><rect x="528" y="80" width="208" height="240" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="632" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">メインメモリ</text><text x="576" y="136" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">番地</text><text x="664" y="136" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">中身（1バイト）</text><g><rect x="544" y="144" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="144" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="544" y="172" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="172" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="544" y="200" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="200" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="544" y="228" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="228" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="544" y="256" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="256" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="544" y="284" width="64" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect><rect x="608" y="284" width="112" height="28" fill="none" stroke="var(--cds-chart-grid)"></rect></g><rect x="544" y="256" width="176" height="28" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="576" y="163" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="664" y="163" text-anchor="middle" fill="var(--cds-text-secondary)">01001000</text><text x="576" y="191" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="664" y="191" text-anchor="middle" fill="var(--cds-text-secondary)">11100011</text><text x="576" y="219" text-anchor="middle" fill="var(--cds-text-secondary)">…</text><text x="664" y="219" text-anchor="middle" fill="var(--cds-text-secondary)">…</text><text x="576" y="247" text-anchor="middle" fill="var(--cds-text-primary)">999</text><text x="664" y="247" text-anchor="middle" fill="var(--cds-text-secondary)">00000111</text><text x="576" y="275" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1000</text><text x="664" y="275" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">00101010</text><text x="576" y="303" text-anchor="middle" fill="var(--cds-text-primary)">1001</text><text x="664" y="303" text-anchor="middle" fill="var(--cds-text-secondary)">10010001</text></g><g><path d="M216 142H528" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#f12-arrow)"></path><text x="248" y="132" font-weight="600" fill="var(--cds-text-primary)">アドレスバス</text><text x="340" y="132" font-size="11.5" fill="var(--cds-text-secondary)">1000番地を指定</text></g><g><path d="M216 178H528" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#f12-arrow)"></path><text x="248" y="168" font-weight="600" fill="var(--cds-text-primary)">制御バス</text><text x="316" y="168" font-size="11.5" fill="var(--cds-text-secondary)">「読み出せ」の合図</text></g><g><path d="M528 270H216" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" marker-end="url(#f12-arrow-accent)"></path><text x="248" y="260" font-weight="600" fill="var(--cds-text-primary)">データバス</text><text x="328" y="260" font-size="11.5" fill="var(--cds-text-secondary)">中身の00101010がCPUへ</text><text x="248" y="292" font-size="11.5" fill="var(--cds-text-secondary)">書き込みのときは逆向きに流れる</text></g></svg>
