<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="宛先が同じネットワークなら直接届け、別のネットワークならデフォルトゲートウェイへ渡す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="gw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">同じネットワークなら直接届け、別ならデフォルトゲートウェイへ渡す</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">スマホは、宛先のネットワーク部を自分のネットワーク部と比べて、最初の渡し先を決める</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M184 174H200V122H216" marker-end="url(#gw-arrow)"></path><path d="M184 194H200V246H216" marker-end="url(#gw-arrow)"></path><path d="M436 122H476" marker-end="url(#gw-arrow)"></path><path d="M436 246H476" marker-end="url(#gw-arrow)"></path></g><g><rect x="24" y="144" width="160" height="80" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="168" font-weight="600" fill="var(--cds-text-primary)">スマホ</text><text x="40" y="188" font-size="11.5" fill="var(--cds-text-secondary)">192.168.1.10</text><text x="40" y="207" font-size="11.5" fill="var(--cds-text-secondary)">マスク 255.255.255.0</text></g><g><rect x="216" y="84" width="220" height="76" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="232" y="107" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">宛先 192.168.1.20</text><text x="232" y="127" font-size="11.5" fill="var(--cds-text-primary)">ネットワーク部が自分と同じ</text><text x="232" y="146" font-size="11.5" fill="var(--cds-text-secondary)">ARPでプリンターのMACを調べる</text><rect x="476" y="84" width="260" height="76" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text x="492" y="107" font-weight="600" fill="var(--cds-text-primary)">プリンター</text><text x="492" y="127" font-size="11.5" fill="var(--cds-text-primary)">192.168.1.20（同じLANの中）</text><text x="492" y="146" font-size="11.5" fill="var(--cds-text-primary)">宛先MACも宛先IPもプリンター</text></g><g><rect x="216" y="208" width="220" height="76" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="232" y="231" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">宛先 203.0.113.25</text><text x="232" y="251" font-size="11.5" fill="var(--cds-text-primary)">ネットワーク部が自分と違う</text><text x="232" y="270" font-size="11.5" fill="var(--cds-text-secondary)">ARPでルーターのMACを調べる</text><rect x="476" y="208" width="260" height="76" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-2)" stroke-width="1.5"></rect><text x="492" y="231" font-weight="600" fill="var(--cds-text-primary)">家のルーター</text><text x="492" y="251" font-size="11.5" fill="var(--cds-text-primary)">192.168.1.1（デフォルトゲートウェイ）</text><text x="492" y="270" font-size="11.5" fill="var(--cds-text-primary)">宛先MACはルーター、宛先IPはそのまま</text></g><text x="476" y="306" font-size="11.5" fill="var(--cds-text-secondary)">ここから先は、ルーターのバケツリレー（図6-2）</text><text x="24" y="352" font-size="11.5" fill="var(--cds-text-secondary)">ネットワーク部は、IPアドレスにサブネットマスクを当てて取り出す（この例では先頭の24ビット）</text></svg>
