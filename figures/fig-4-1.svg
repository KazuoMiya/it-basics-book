<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="インデックスは、先頭から何個ずれた位置かを表す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="arr41-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">インデックスは、先頭から何個ずれた位置かを表す</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">文字列への参照を8バイト、参照の配列の先頭を1,000番地と仮定</text><text x="24" y="96" fill="var(--cds-text-secondary)">インデックス</text><text x="24" y="132" fill="var(--cds-text-secondary)">参照先</text><text x="24" y="180" fill="var(--cds-text-secondary)">番地</text><g><rect x="152" y="104" width="120" height="48" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="212" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">0</text><text x="212" y="132" text-anchor="middle" fill="var(--cds-text-primary)">→ 海.jpg</text><text x="212" y="180" text-anchor="middle" fill="var(--cds-text-primary)">1,000番地</text></g><g><rect x="272" y="104" width="120" height="48" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="332" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">1</text><text x="332" y="132" text-anchor="middle" fill="var(--cds-text-primary)">→ 空.jpg</text><text x="332" y="180" text-anchor="middle" fill="var(--cds-text-primary)">1,008番地</text></g><g><rect x="392" y="104" width="120" height="48" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="452" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">2</text><text x="452" y="132" text-anchor="middle" fill="var(--cds-text-primary)">→ 猫.jpg</text><text x="452" y="180" text-anchor="middle" fill="var(--cds-text-primary)">1,016番地</text></g><g><rect x="512" y="104" width="120" height="48" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="572" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="572" y="132" text-anchor="middle" fill="var(--cds-text-primary)">→ 花.jpg</text><text x="572" y="180" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1,024番地</text></g><g><path d="M632 104H688M632 152H688" fill="none" stroke="var(--cds-chart-grid)" stroke-width="1.25" stroke-dasharray="4 4"></path><text x="660" y="132" text-anchor="middle" fill="var(--cds-text-secondary)">…</text></g><g><path d="M152 198V214" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><path d="M152 206H512" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#arr41-arrow)"></path><text x="332" y="232" text-anchor="middle" fill="var(--cds-text-primary)">先頭から3個分（3 × 8 = 24バイト）ずれた位置が、インデックス3</text></g><g><rect x="152" y="252" width="536" height="56" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="420" y="275" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">番地 ＝ 先頭の番地 ＋ インデックス × 要素の大きさ</text><text x="420" y="297" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">例：1,000 ＋ 3 × 8 ＝ 1,024番地</text></g></svg>
