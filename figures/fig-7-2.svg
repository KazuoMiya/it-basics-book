<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-label="HTTPSは、鍵を共有し、証明書と署名で相手を確かめてから暗号化通信を始める" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="tls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="tls-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">HTTPSは、鍵を共有し、証明書と署名で相手を確かめてから暗号化通信を始める</text><text x="24" y="52" font-size="11.5" fill="var(--cds-text-secondary)">TLS 1.3の流れを単純化して示したもの</text><g><line x1="150" x2="150" y1="124" y2="232" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="150" x2="150" y1="284" y2="466" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="150" x2="150" y1="570" y2="680" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="610" x2="610" y1="124" y2="232" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="610" x2="610" y1="284" y2="680" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></line></g><g><rect x="60" y="72" width="180" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="150" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">ブラウザー</text><text x="150" y="113" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">利用者のスマホやパソコン</text></g><g><rect x="520" y="72" width="180" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="610" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">サーバー</text><text x="610" y="113" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ショッピングサイトなど</text></g><g><path d="M150 166H610" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="156" text-anchor="middle" fill="var(--cds-text-primary)">1　使える暗号方式と、鍵交換の材料</text></g><g><path d="M610 214H150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="204" text-anchor="middle" fill="var(--cds-text-primary)">2　使う暗号方式と、サーバー側の鍵交換の材料</text></g><g><rect x="96" y="232" width="568" height="52" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="380" y="254" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">3　双方が、交換した材料から同じ共通鍵を計算する</text><text x="380" y="273" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">共通鍵そのものはネットワークに流れない。材料は接続ごとの使い捨て</text></g><g><line x1="24" x2="736" y1="306" y2="306" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" stroke-dasharray="6 4"></line><text x="736" y="299" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">ここから先は暗号化</text></g><g><path d="M610 346H150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="336" text-anchor="middle" fill="var(--cds-text-primary)">4　電子証明書</text></g><g><path d="M610 394H150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="384" text-anchor="middle" fill="var(--cds-text-primary)">5　ここまでのやりとり全体への署名（証明書の秘密鍵で作る）</text></g><g><path d="M610 442H150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="432" text-anchor="middle" fill="var(--cds-text-primary)">6　Finished（完了を確かめる値）</text></g><g><rect x="40" y="466" width="290" height="104" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="490" font-weight="600" fill="var(--cds-text-primary)">7　ブラウザーが検証する</text><text x="56" y="508" font-size="11.5" fill="var(--cds-text-primary)">証明書：認証局の署名をルート証明書までたどる</text><text x="56" y="524" font-size="11.5" fill="var(--cds-text-primary)">証明書：ドメイン名と有効期限を確かめる</text><text x="56" y="540" font-size="11.5" fill="var(--cds-text-primary)">署名：証明書の公開鍵で検証する</text><text x="56" y="556" font-size="11.5" fill="var(--cds-text-primary)">Finished：値が合うかを確かめる</text></g><g><rect x="384" y="476" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="492" y="498" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ルート証明書</text><text x="492" y="518" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">OSやブラウザーに組み込み済み</text><path d="M384 504H330" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="357" y="496" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">照合</text></g><g><path d="M150 612H610" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#tls-arrow)"></path><text x="380" y="602" text-anchor="middle" fill="var(--cds-text-primary)">7　ブラウザーのFinished</text></g><g><path d="M150 664H610" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" marker-start="url(#tls-accent)" marker-end="url(#tls-accent)"></path><text x="380" y="652" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">8　暗号化されたHTTPのやりとり（共通鍵暗号）</text></g></svg>
