<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="実行中のプロセスは、メモリを用途の異なる4つの領域に分けて使う" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f33-arrow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-2)"></path></marker><marker id="f33-arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">実行中のプロセスは、メモリを用途の異なる4つの領域に分けて使う</text><g><text x="184" y="80" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">アドレスが大きい側</text><text x="184" y="424" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">アドレスが小さい側</text></g><g><rect x="200" y="64" width="220" height="368" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect></g><g><rect x="200" y="64" width="220" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="310" y="96" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">スタック領域</text><text x="310" y="114" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">関数を呼ぶたびに積まれる</text><path d="M310 140V172" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" marker-end="url(#f33-arrow-s)"></path><text x="322" y="162" font-size="11.5" fill="var(--cds-text-secondary)">下向きに伸びる</text><line x1="428" x2="448" y1="100" y2="100" stroke="var(--cds-chart-grid)"></line><text x="452" y="96" fill="var(--cds-text-primary)">関数の引数、関数の中だけで使う変数、</text><text x="452" y="114" fill="var(--cds-text-primary)">戻り先。関数が終わると取り除かれる</text></g><g><text x="310" y="216" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">空き領域</text><text x="310" y="234" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">（ヒープとスタックが使う）</text></g><g><rect x="200" y="280" width="220" height="72" fill="var(--cds-chart-categorical-2)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-2)" stroke-width="2"></rect><text x="310" y="312" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ヒープ領域</text><text x="310" y="330" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">必要に応じて確保・解放</text><path d="M310 276V244" fill="none" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25" marker-end="url(#f33-arrow-h)"></path><text x="322" y="266" font-size="11.5" fill="var(--cds-text-secondary)">上向きに伸びる</text><line x1="428" x2="448" y1="316" y2="316" stroke="var(--cds-chart-grid)"></line><text x="452" y="312" fill="var(--cds-text-primary)">実行中に大きさが決まるデータ。</text><text x="452" y="330" fill="var(--cds-text-primary)">解放し忘れるとメモリリークになる</text></g><g><rect x="200" y="352" width="220" height="40" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="310" y="376" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データ領域</text><line x1="428" x2="448" y1="372" y2="372" stroke="var(--cds-chart-grid)"></line><text x="452" y="376" fill="var(--cds-text-primary)">実行中ずっと使う値（設定値など）</text></g><g><rect x="200" y="392" width="220" height="40" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="310" y="416" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">コード領域</text><line x1="428" x2="448" y1="412" y2="412" stroke="var(--cds-chart-grid)"></line><text x="452" y="416" fill="var(--cds-text-primary)">機械語の命令。プログラムカウンターが指す</text></g></svg>
