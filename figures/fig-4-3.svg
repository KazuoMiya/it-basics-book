<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-label="連結リストへの挿入は、挿入する位置が分かっていれば、ポインターを2か所書き換えるだけで済む" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f43-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="f43-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">連結リストへの挿入は、ポインターを2か所書き換えるだけで済む</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">箱の右の区画が、次のデータの場所を指すポインター。AとBの間にXを挿入する</text><g><text x="24" y="112" font-weight="600" fill="var(--cds-text-primary)">挿入前</text><text x="180" y="78" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">先頭</text><g><rect x="150" y="86" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="210" x2="210" y1="86" y2="130" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="180" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A</text><circle cx="228" cy="108" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g><rect x="370" y="86" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="430" x2="430" y1="86" y2="130" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="400" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">B</text><circle cx="448" cy="108" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g><rect x="590" y="86" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="650" x2="650" y1="86" y2="130" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="620" y="113" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">C</text><circle cx="668" cy="108" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M228 108H366" marker-end="url(#f43-arrow)"></path><path d="M448 108H586" marker-end="url(#f43-arrow)"></path></g><text x="668" y="148" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">次はない（末尾）</text></g><line x1="24" x2="736" y1="176" y2="176" stroke="var(--cds-chart-grid)"></line><g><text x="24" y="238" font-weight="600" fill="var(--cds-text-primary)">挿入後</text><g><rect x="150" y="212" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="210" x2="210" y1="212" y2="256" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="180" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A</text><circle cx="228" cy="234" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g><rect x="370" y="212" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="430" x2="430" y1="212" y2="256" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="400" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">B</text><circle cx="448" cy="234" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g><rect x="590" y="212" width="96" height="44" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="650" x2="650" y1="212" y2="256" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><text x="620" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">C</text><circle cx="668" cy="234" r="3.5" fill="var(--cds-chart-axis)"></circle></g><g><rect x="260" y="304" width="96" height="44" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><line x1="320" x2="320" y1="304" y2="348" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></line><text x="290" y="331" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">X</text><circle cx="338" cy="326" r="3.5" fill="var(--cds-chart-categorical-1)"></circle></g><path d="M448 234H586" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f43-arrow)"></path><path d="M232 234H366" fill="none" stroke="var(--cds-text-secondary)" stroke-width="1.25" stroke-dasharray="4 4"></path><text x="299" y="226" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">元の矢印は消える</text><g fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"><path d="M338 326H418V260" marker-end="url(#f43-arrow-a)"></path><path d="M228 238V326H256" marker-end="url(#f43-arrow-a)"></path></g><text x="432" y="300" font-weight="600" fill="var(--cds-text-primary)">① Xのポインターに、Bの場所を書く</text><text x="432" y="318" font-size="11.5" fill="var(--cds-text-secondary)">Bの場所は、Aのポインターから写す</text><text x="214" y="300" text-anchor="end" font-weight="600" fill="var(--cds-text-primary)">② Aのポインターを、</text><text x="214" y="318" text-anchor="end" font-weight="600" fill="var(--cds-text-primary)">Xの場所に書き換える</text></g><text x="24" y="384" font-size="12" fill="var(--cds-text-primary)">書き換えが2か所で済むのは、挿入する位置（A）が分かっているとき。位置を探すには、先頭から順にたどる必要がある</text></svg>
