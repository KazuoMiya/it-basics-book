<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="プロセスごとの仮想アドレスを、ページテーブルが物理メモリやストレージに対応づける" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="f14-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">プロセスごとの仮想アドレスを、ページテーブルが物理メモリに対応づける</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">アプリAとアプリBは、同じ「ページ0」という番地を使っても、別々の物理メモリを読み書きする</text><g><text x="104" y="100" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">アプリAの仮想アドレス</text><g><rect x="24" y="128" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="104" y="149" text-anchor="middle" fill="var(--cds-text-primary)">ページ0</text></g><g><rect x="24" y="160" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="104" y="181" text-anchor="middle" fill="var(--cds-text-primary)">ページ1</text></g><g><rect x="24" y="192" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="104" y="213" text-anchor="middle" fill="var(--cds-text-primary)">ページ2</text></g></g><g><text x="656" y="100" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">アプリBの仮想アドレス</text><g><rect x="576" y="128" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="656" y="149" text-anchor="middle" fill="var(--cds-text-primary)">ページ0</text></g><g><rect x="576" y="160" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="656" y="181" text-anchor="middle" fill="var(--cds-text-primary)">ページ1</text></g><g><rect x="576" y="192" width="160" height="32" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="656" y="213" text-anchor="middle" fill="var(--cds-text-primary)">ページ2</text></g></g><g><text x="380" y="100" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">物理メモリ</text><g><rect x="300" y="112" width="160" height="32" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="133" text-anchor="middle" fill="var(--cds-text-primary)">Aのページ0</text></g><g><rect x="300" y="144" width="160" height="32" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="165" text-anchor="middle" fill="var(--cds-text-primary)">Bのページ0</text></g><g><rect x="300" y="176" width="160" height="32" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="197" text-anchor="middle" fill="var(--cds-text-primary)">Aのページ1</text></g><g><rect x="300" y="208" width="160" height="32" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="229" text-anchor="middle" fill="var(--cds-text-primary)">Bのページ1</text></g><g><rect x="300" y="240" width="160" height="32" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="261" text-anchor="middle" fill="var(--cds-text-primary)">Bのページ2</text></g></g><g><rect x="300" y="308" width="160" height="32" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" stroke-dasharray="5 4"></rect><text x="380" y="329" text-anchor="middle" fill="var(--cds-text-primary)">Aのページ2</text><text x="380" y="360" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ストレージ（スワップ領域）</text></g><g><path d="M184 144L298 128" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f14-arrow)"></path><path d="M184 176L298 192" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f14-arrow)"></path><path d="M576 144L462 160" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f14-arrow)"></path><path d="M576 176L462 224" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f14-arrow)"></path><path d="M576 208L462 256" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#f14-arrow)"></path><path d="M184 208L298 324" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f14-arrow-accent)"></path></g><text x="104" y="250" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Aのページテーブルで変換</text><text x="656" y="250" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Bのページテーブルで変換</text><text x="104" y="300" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">しばらく使っていないページは</text><text x="104" y="318" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ストレージへ（ページアウト）</text></svg>
