<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="コンパイラーは実行前に一度だけ翻訳し、インタープリターは実行しながら解釈する" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f31-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">コンパイラーは実行前に一度だけ翻訳し、インタープリターは実行しながら解釈する</text><g><text x="24" y="72" font-weight="600" fill="var(--cds-text-primary)">コンパイラー方式</text><text x="144" y="72" font-size="11.5" fill="var(--cds-text-secondary)">実行の前に、まとめて機械語へ翻訳する</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M164 116H214" marker-end="url(#f31-arrow)"></path><path d="M354 116H404" marker-end="url(#f31-arrow)"></path><path d="M544 116H594" marker-end="url(#f31-arrow)"></path></g><g><rect x="24" y="88" width="140" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="94" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ソースコード</text><text x="94" y="129" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">人間が書いた文章</text></g><g><rect x="214" y="88" width="140" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="284" y="112" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">コンパイラー</text>