<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="プロセスは実行可能・実行・待ちの3つの状態を移り変わる" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f32-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">プロセスは3つの状態を移り変わり、CPUを使えるのは実行状態のときだけ</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M34 120H96" marker-end="url(#f32-arrow)"></path><path d="M300 108H466" marker-end="url(#f32-arrow)"></path><path d="M470 134H304" marker-end="url(#f32-arrow)"></path><path d="M670 120H732" marker-end="url(#f32-arrow)"></path><path d="M570 150V300H484" marker-end="url(#f32-arrow)"></path><path d="M280 300H200V154" marker-end="url(#f32-arrow)"></path></g><g><rect x="100" y="90" width="200" height="60" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="200" y="116" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">実行可能状態</text><text x="200" y="134" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">CPUが空くのを、列に並んで待つ</text></g><g><rect x="470" y="90" width="200" height="60" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="570" y="116" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">実行状態</text><text x="570" y="134" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">CPUで命令を実行している</text></g><g><rect x="280" y="270" width="200" height="60" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="296" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">待ち状態</text><text x="380" y="314" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">入出力の完了などを待つ</text></g><g font-size="12"><text x="64" y="110" text-anchor="middle" fill="var(--cds-text-secondary)">起動</text><text x="702" y="110" text-anchor="middle" fill="var(--cds-text-secondary)">終了</text><text x="385" y="98" text-anchor="middle" fill="var(--cds-text-primary)">CPUを割り当てられる</text><text x="385" y="154" text-anchor="middle" fill="var(--cds-text-primary)">持ち時間を使い切る</text><text x="385" y="172" text-anchor="middle" fill="var(--cds-text-secondary)">（タイマーの割込み）</text><text x="584" y="218" fill="var(--cds-text-primary)">入出力を頼み、</text><text x="584" y="236" fill="var(--cds-text-primary)">完了を待つ</text><text x="186" y="218" text-anchor="end" fill="var(--cds-text-primary)">入出力が完了する</text><text x="186" y="236" text-anchor="end" fill="var(--cds-text-secondary)">（割込みで知らされる）</text></g></svg>
