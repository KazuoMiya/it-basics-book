<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="各ルーターは次の1区間だけを決めてパケットを手渡す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="relay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">各ルーターは次の1区間だけを決めてパケットを手渡す</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">この例では宛先IPは203.0.113.25のまま。ルーターを通るたびにTTLは減る</text><g><path d="M124 140V168" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#relay-arrow)"></path><path d="M124 224V252" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#relay-arrow)"></path><path d="M124 308V336" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#relay-arrow)"></path><path d="M124 392V420" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#relay-arrow)"></path></g><g><rect x="24" y="84" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="107" font-weight="600" fill="var(--cds-text-primary)">スマホ</text><text x="40" y="126" font-size="11.5" fill="var(--cds-text-secondary)">192.168.1.10</text><g><path d="M224 112H264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><rect x="264" y="92" width="472" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect></g><text x="280" y="116" font-size="12.5" fill="var(--cds-text-primary)">宛先は別のネットワーク。まず家のルーターへ渡す</text></g><g><rect x="24" y="168" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="191" font-weight="600" fill="var(--cds-text-primary)">家のルーター</text><text x="40" y="210" font-size="11.5" fill="var(--cds-text-secondary)">家のLANと外の境目</text><g><path d="M224 196H264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><rect x="264" y="176" width="472" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect></g><text x="280" y="200" font-size="12.5" fill="var(--cds-text-primary)">表に当てはまる行がない。デフォルトルートでISPへ</text></g><g><rect x="24" y="252" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="275" font-weight="600" fill="var(--cds-text-primary)">ISPのルーター</text><text x="40" y="294" font-size="11.5" fill="var(--cds-text-secondary)">プロバイダーの配送拠点</text><g><path d="M224 280H264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><rect x="264" y="260" width="472" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect></g><text x="280" y="284" font-size="12.5" fill="var(--cds-text-primary)">表を引くと「203.0.113.0/24宛ては、あちらのルーターへ」</text></g><g><rect x="24" y="336" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="359" font-weight="600" fill="var(--cds-text-primary)">途中のルーター</text><text x="40" y="378" font-size="11.5" fill="var(--cds-text-secondary)">いくつも続く</text><g><path d="M224 364H264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><rect x="264" y="344" width="472" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect></g><text x="280" y="368" font-size="12.5" fill="var(--cds-text-primary)">どのルーターも、次に渡す相手だけを決めて手渡す</text></g><g><rect x="24" y="420" width="200" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="443" font-weight="600" fill="var(--cds-text-primary)">Webサーバー</text><text x="40" y="462" font-size="11.5" fill="var(--cds-text-primary)">203.0.113.25</text><g><path d="M224 448H264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><rect x="264" y="428" width="472" height="40" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect></g><text x="280" y="452" font-size="12.5" fill="var(--cds-text-primary)">宛先のIPアドレスに到着。ここで受け取って処理する</text></g></svg>
