<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="データは記憶装置を中心に流れ、制御装置が各装置に指示を出す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">データは記憶装置を中心に流れ、制御装置が各装置に指示を出す</text><g><line x1="24" y1="58" x2="60" y2="58" stroke="var(--cds-chart-axis)" stroke-width="1.75"></line><text x="68" y="62" font-size="11.5" fill="var(--cds-text-secondary)">データの流れ</text><line x1="180" y1="58" x2="216" y2="58" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></line><text x="224" y="62" font-size="11.5" fill="var(--cds-text-secondary)">制御の流れ（指示）</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.75"><path d="M194 128H290" marker-end="url(#f11-arrow)"></path><path d="M470 128H566" marker-end="url(#f11-arrow)"></path><path d="M306 156V240" marker-end="url(#f11-arrow)"></path><path d="M346 240V156" marker-end="url(#f11-arrow)"></path></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"><path d="M396 268H364" marker-end="url(#f11-arrow)"></path><path d="M420 240V156" marker-end="url(#f11-arrow)"></path><path d="M564 268H650V156" marker-end="url(#f11-arrow)"></path><path d="M480 296V336H60V156" marker-end="url(#f11-arrow)"></path></g><text x="298" y="190" text-anchor="end" font-size=