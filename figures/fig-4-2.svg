<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-label="スタックは最後に入れたものから、キューは最初に入れたものから取り出す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="sq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">スタックは最後に入れたものから、キューは最初に入れたものから取り出す</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">色付きの箱は、次に取り出されるデータ</text><g><rect x="24" y="72" width="712" height="204" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="40" y="100" font-size="15" font-weight="600" fill="var(--cds-text-primary)">スタック</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M215 106V140" marker-end="url(#sq-arrow)"></path><path d="M265 140V106" marker-end="url(#sq-arrow)"></path></g><text x="207" y="128" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">プッシュ</text><text x="273" y="128" font-size="11.5" fill="var(--cds-text-secondary)">ポップ</text><text x="160" y="166" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">一番上</text><rect x="170" y="144" width="140" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="240" y="166" text-anchor="middle" fill="var(--cds-text-primary)">色を変える</text><rect x="170" y="184" width="140" height="36" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="240" y="206" text-anchor="middle" fill="var(--cds-text-primary)">太字にする</text><rect x="170" y="224" width="140" height="36" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="240" y="246" text-anchor="middle" fill="var(--cds-text-primary)">文字を入力</text><text x="520" y="168" font-weight="600" fill="var(--cds-text-primary)">後入れ先出し（LIFO）</text><text x="520" y="192" fill="var(--cds-text-primary)">最後に入れたものが</text><text x="520" y="212" fill="var(--cds-text-primary)">最初に出てくる</text><text x="520" y="240" font-size="11.5" fill="var(--cds-text-secondary)">例：元に戻す、ブラウザーの戻る</text></g><g><rect x="24" y="300" width="712" height="152" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="40" y="328" font-size="15" font-weight="600" fill="var(--cds-text-primary)">キュー</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M128 380H48" marker-end="url(#sq-arrow)"></path><path d="M488 380H428" marker-end="url(#sq-arrow)"></path></g><text x="88" y="368" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">取り出す</text><text x="458" y="368" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">並ぶ</text><rect x="132" y="360" width="92" height="40" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="178" y="384" text-anchor="middle" fill="var(--cds-text-primary)">見積書.pdf</text><rect x="232" y="360" width="92" height="40" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="278" y="384" text-anchor="middle" fill="var(--cds-text-primary)">請求書.pdf</text><rect x="332" y="360" width="92" height="40" rx="6" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="378" y="384" text-anchor="middle" fill="var(--cds-text-primary)">地図.png</text><text x="178" y="420" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">先頭</text><text x="378" y="420" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">最後尾</text><text x="520" y="360" font-weight="600" fill="var(--cds-text-primary)">先入れ先出し（FIFO）</text><text x="520" y="384" fill="var(--cds-text-primary)">最初に入れたものが</text><text x="520" y="404" fill="var(--cds-text-primary)">最初に出てくる</text><text x="520" y="432" font-size="11.5" fill="var(--cds-text-secondary)">例：印刷待ち、レジの行列</text></g></svg>
