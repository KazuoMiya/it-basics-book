<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-label="リゾルバーが上の階層から順に尋ね、権威DNSサーバーが答えを返す" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="dns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">リゾルバーが上の階層から順に尋ね、権威DNSサーバーが答えを返す</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">スマホのブラウザーで www.example.co.jp を開くとき</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M144 216H232" marker-end="url(#dns-arrow)"></path><path d="M232 248H144" marker-end="url(#dns-arrow)"></path><g><path d="M432 104H520" marker-end="url(#dns-arrow)"></path><path d="M520 136H432" marker-end="url(#dns-arrow)"></path></g><g><path d="M432 216H520" marker-end="url(#dns-arrow)"></path><path d="M520 248H432" marker-end="url(#dns-arrow)"></path></g><g><path d="M432 328H520" marker-end="url(#dns-arrow)"></path><path d="M520 360H432" marker-end="url(#dns-arrow)"></path></g></g><g><rect x="24" y="196" width="120" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="84" y="228" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">スマホ</text><text x="84" y="248" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ブラウザー</text></g><text x="188" y="208" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">① 質問</text><text x="188" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">⑧ 回答</text><g><rect x="232" y="84" width="200" height="296" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="332" y="176" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">フルサービスリゾルバー</text><text x="332" y="196" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">（キャッシュDNSサーバー）</text><text x="332" y="214" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ISPなどが用意する</text><rect x="248" y="292" width="168" height="72" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="332" y="314" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">キャッシュ</text><text x="332" y="334" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">調べた答えを</text><text x="332" y="350" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">TTLの間だけ覚える</text></g><text x="476" y="97" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">② 質問</text><text x="476" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">③ 案内</text><text x="476" y="209" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">④ 質問</text><text x="476" y="264" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">⑤ 案内</text><text x="476" y="321" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">⑥ 質問</text><text x="476" y="376" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">⑦ 回答</text><g><rect x="520" y="84" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="106" font-weight="600" fill="var(--cds-text-primary)">ルートサーバー</text><text x="536" y="126" font-size="11.5" fill="var(--cds-text-secondary)">名前の木の頂点</text><text x="536" y="144" font-size="11.5" fill="var(--cds-text-primary)">「jpはjpのサーバーへ」</text></g><g><rect x="520" y="196" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="218" font-weight="600" fill="var(--cds-text-primary)">TLDのサーバー</text><text x="536" y="238" font-size="11.5" fill="var(--cds-text-secondary)">jpを担当</text><text x="536" y="256" font-size="11.5" fill="var(--cds-text-primary)">「example.co.jpはこちらへ」</text></g><g><rect x="520" y="308" width="216" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="536" y="330" font-weight="600" fill="var(--cds-text-primary)">権威DNSサーバー</text><text x="536" y="350" font-size="11.5" fill="var(--cds-text-secondary)">example.co.jpを担当</text><text x="536" y="368" font-size="11.5" fill="var(--cds-text-primary)">「IPアドレスは203.0.113.25」</text></g></svg>
