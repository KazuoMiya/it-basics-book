<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" role="img" aria-label="トランザクションは「全部確定」か「全部取り消し」のどちらかで終わる" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="tx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="warn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-status-warning)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">トランザクションは「全部確定」か「全部取り消し」のどちらかで終わる</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">AさんからBさんへ1万円を振り込む例</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M177 104H210" marker-end="url(#tx-arrow)"></path><path d="M363 104H396" marker-end="url(#tx-arrow)"></path><path d="M549 104H582" marker-end="url(#tx-arrow)"></path><path d="M211 142V150H549V142"></path></g><g fill="none" stroke="var(--cds-chart-status-warning)" stroke-width="1.5"><path d="M380 150V213" marker-end="url(#warn-arrow)"></path><path d="M292 242H178" marker-end="url(#warn-arrow)"></path></g><g><rect x="25" y="76" width="152" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="101" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">BEGIN</text><text x="101" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">トランザクション開始</text></g><g><rect x="211" y="76" width="152" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="287" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">処理1</text><text x="287" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Aの残高を1万円減らす</text></g><g><rect x="397" y="76" width="152" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="473" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">処理2</text><text x="473" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Bの残高を1万円増やす</text></g><g><rect x="583" y="76" width="152" height="56" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="659" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">COMMIT</text><text x="659" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">すべて成功したら確定</text></g><g><rect x="292" y="214" width="176" height="56" rx="8" fill="var(--cds-chart-status-warning)" fill-opacity="0.12" stroke="var(--cds-chart-status-warning)" stroke-width="2"></rect><text x="380" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">ROLLBACK</text><text x="380" y="256" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">変更をすべて取り消す</text></g><g><rect x="25" y="214" width="152" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="101" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">開始前の状態に戻る</text><text x="101" y="256" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">AもBも振込前の残高</text></g><text x="392" y="176" font-size="11.5" fill="var(--cds-text-primary)">この間でエラーが起きたら、アプリケーションが指示する</text><text x="659" y="156" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">AとBの変更がそろって残る</text><text x="24" y="304" font-size="11.5" fill="var(--cds-text-secondary)">コミット前に停電などでサーバーが止まった場合は、指示がなくても、DBMSが再起動時に確定していない変更を取り消す。</text></svg>
