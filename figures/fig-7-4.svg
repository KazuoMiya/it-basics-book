<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="CSRFは、ブラウザーがCookieを自動で付けることを利用し、CSRFトークンで防げる" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="csrf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">CSRFは、Cookieが自動で付くことを利用する。CSRFトークンで見分けられる</text><g><rect x="24" y="60" width="348" height="372" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="40" y="88" font-weight="600" fill="var(--cds-text-primary)">対策なし</text><g><g><rect x="40" y="104" width="150" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="115" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">罠サイト</text><text x="115" y="144" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">攻撃者が用意したページ</text></g><g><rect x="206" y="104" width="150" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="281" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">利用者のブラウザー</text><text x="281" y="144" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ショップにログイン中</text></g><path d="M190 130H206" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><path d="M281 156V188" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><g><rect x="40" y="188" width="316" height="92" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="210" font-weight="600" fill="var(--cds-text-primary)">ショップあてのリクエスト</text><text x="56" y="230" font-size="11.5" fill="var(--cds-text-primary)">内容：届け先の住所を変更する</text><text x="56" y="248" font-size="11.5" fill="var(--cds-text-primary)">Cookie：ブラウザーが自動で付ける</text><text x="56" y="266" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">サーバーは、Cookieだけで本人の操作と判断する</text></g><path d="M198 280V312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><g><rect x="40" y="312" width="316" height="56" rx="8" fill="var(--cds-chart-status-critical)" fill-opacity="0.12" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><text x="198" y="336" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">サーバーが受け付けてしまう</text><text x="198" y="355" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">住所が攻撃者の指定に書き換わる</text></g><text x="198" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">攻撃者はCookieの中身を知らなくてよい</text><text x="198" y="412" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">利用者が罠サイトを開くだけで起きる</text></g></g><g><rect x="388" y="60" width="348" height="372" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="404" y="88" font-weight="600" fill="var(--cds-text-primary)">CSRFトークンで照合する</text><g><g><rect x="404" y="104" width="150" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="479" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">罠サイト</text><text x="479" y="144" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">攻撃者が用意したページ</text></g><g><rect x="570" y="104" width="150" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="645" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">利用者のブラウザー</text><text x="645" y="144" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ショップにログイン中</text></g><path d="M554 130H570" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><path d="M645 156V188" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><g><rect x="404" y="188" width="316" height="92" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="420" y="210" font-weight="600" fill="var(--cds-text-primary)">ショップあてのリクエスト</text><text x="420" y="230" font-size="11.5" fill="var(--cds-text-primary)">内容：届け先の住所を変更する</text><text x="420" y="248" font-size="11.5" fill="var(--cds-text-primary)">Cookie：ブラウザーが自動で付ける</text><text x="420" y="266" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">CSRFトークン：なし（罠サイトには分からない）</text></g><path d="M562 280V312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#csrf-arrow)"></path><g><rect x="404" y="312" width="316" height="56" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="562" y="336" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">サーバーが拒否する</text><text x="562" y="355" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">画面に埋め込んだ値と合わない</text></g><text x="562" y="394" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">正規の画面からの操作には、トークンが付く</text><text x="562" y="412" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ので、本人の操作だけが通る</text></g></g></svg>
