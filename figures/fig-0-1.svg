<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" role="img" aria-label="数秒の投稿の中に、本書の7つの章がすべて詰まっている" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">数秒の投稿の中に、本書の7つの章がすべて詰まっている</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M240 88H270" marker-end="url(#map-arrow)"></path><path d="M488 88H518" marker-end="url(#map-arrow)"></path><path d="M628 116V166" marker-end="url(#map-arrow)"></path><path d="M520 196H490" marker-end="url(#map-arrow)"></path><path d="M272 196H242" marker-end="url(#map-arrow)"></path></g><g><rect x="24" y="60" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="132" y="84" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">スマホで撮影して数値にする</text><text x="132" y="104" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">第1章・第2章</text></g><g><rect x="272" y="60" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="84" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">アプリが投稿をまとめる</text><text x="380" y="104" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">第3章・第4章</text></g><g><rect x="520" y="60" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="628" y="84" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">暗号化して送り出す</text><text x="628" y="104" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">第7章</text></g><g><rect x="520" y="168" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="628" y="192" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">インターネットを渡る</text><text x="628" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">第6章</text></g><g><rect x="272" y="168" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="192" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データベースに保存する</text><text x="380" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">第5章</text></g><g><rect x="24" y="168" width="216" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="132" y="192" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">友人のスマホに表示</text><text x="132" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">同じしくみを逆向きに</text></g></svg>
