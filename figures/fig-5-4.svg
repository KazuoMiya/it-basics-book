<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" role="img" aria-label="ブラウザーはデータベースに直接つながらず、アプリケーションサーバーを通る" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="tier-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">ブラウザーはデータベースに直接つながらず、アプリケーションサーバーを通る</text><g><rect x="528" y="52" width="208" height="152" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="4 4"></rect><text x="540" y="70" font-size="11.5" fill="var(--cds-text-secondary)">内側のネットワーク</text></g><g><path d="M116 188V236H632V189" fill="none" stroke="var(--cds-text-secondary)" stroke-width="1.25" stroke-dasharray="5 4"></path><rect x="360" y="222" width="28" height="28" rx="14" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-status-critical)" stroke-width="1.5"></rect><path d="M368 230L380 242M380 230L368 242" stroke="var(--cds-chart-status-critical)" stroke-width="2"></path><text x="374" y="270" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">ブラウザーからデータベースへ直接はつながない</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M208 130H281" marker-end="url(#tier-arrow)"></path><path d="M282 158H209" marker-end="url(#tier-arrow)"></path><path d="M466 130H539" marker-end="url(#tier-arrow)"></path><path d="M540 158H467" marker-end="url(#tier-arrow)"></path></g><g><text x="116" y="90" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">プレゼンテーション層</text><rect x="24" y="100" width="184" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="116" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ブラウザー</text><text x="116" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">画面を表示する</text><text x="116" y="170" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">操作を受け付ける</text></g><g><text x="374" y="90" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">アプリケーション層</text><rect x="282" y="100" width="184" height="88" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="374" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">アプリケーションサーバー</text><text x="374" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">在庫の確認などの処理</text><text x="374" y="170" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">SQLを組み立てて送る</text></g><g><text x="632" y="90" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">データ層</text><rect x="540" y="100" width="184" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="632" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データベースサーバー</text><text x="632" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">データを保管する</text><text x="632" y="170" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">SQLを実行して結果を返す</text></g><text x="245" y="122" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">注文の依頼</text><text x="245" y="176" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">結果の画面</text><text x="503" y="122" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">SQL</text><text x="503" y="176" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">結果</text></svg>
