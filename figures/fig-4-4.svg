<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="二分探索木では、どの節でも左の子孫は自分より小さく、右の子孫は自分より大きい。60を探すときは50、70、60の順に3回比べる" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">二分探索木では、左の子孫は自分より小さく、右の子孫は自分より大きい</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">色付きの節は、60を探すときに通る道筋</text><g><line x1="360.6" y1="114.4" x2="249.4" y2="173.6" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><line x1="399.4" y1="114.4" x2="510.6" y2="173.6" stroke="var(--cds-chart-categorical-1)" stroke-width="2.5"></line><line x1="215.0" y1="200.0" x2="170.0" y2="248.0" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><line x1="245.0" y1="200.0" x2="290.0" y2="248.0" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><line x1="515.0" y1="200.0" x2="470.0" y2="248.0" stroke="var(--cds-chart-categorical-1)" stroke-width="2.5"></line><line x1="545.0" y1="200.0" x2="590.0" y2="248.0" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line></g><g><g><circle cx="380" cy="104" r="22" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="380" y="109" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">50</text></g><g><circle cx="230" cy="184" r="22" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text x="230" y="189" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">30</text></g><g><circle cx="530" cy="184" r="22" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="530" y="189" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">70</text></g><g><circle cx="155" cy="264" r="22" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text x="155" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">20</text></g><g><circle cx="305" cy="264" r="22" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text x="305" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">40</text></g><g><circle cx="455" cy="264" r="22" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text x="455" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">60</text></g><g><circle cx="605" cy="264" r="22" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text x="605" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">80</text></g></g><g font-size="12"><text x="348" y="100" text-anchor="end" fill="var(--cds-text-secondary)">根</text><text x="123" y="269" text-anchor="end" fill="var(--cds-text-secondary)">葉</text><text x="412" y="100" fill="var(--cds-text-primary)">① 60は50より大きい → 右へ</text><text x="562" y="180" fill="var(--cds-text-primary)">② 60は70より小さい → 左へ</text><text x="455" y="308" text-anchor="middle" fill="var(--cds-text-primary)">③ 見つかった</text></g><text x="24" y="344" font-size="12" fill="var(--cds-text-primary)">左→自分→右の順（間順）ですべての節をたどると、20、30、40、50、60、70、80と小さい順に並ぶ</text></svg>
