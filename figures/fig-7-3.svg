<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-label="SQLインジェクションは入力が命令に混ざって起き、プレースホルダーで防げる" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="sqli-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">SQLインジェクションは入力が命令に混ざって起き、プレースホルダーで防げる</text><g><rect x="24" y="60" width="348" height="324" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="40" y="88" font-size="14" font-weight="600" fill="var(--cds-text-primary)">危険：入力をそのまま連結する</text><g><rect x="40" y="104" width="150" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="115" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">命令のひな形</text><text x="115" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">SQL文の決まった部分</text></g><g><rect x="206" y="104" width="150" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="281" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">利用者の入力</text><text x="281" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">細工された文字列</text></g><g><path d="M115 160V216" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#sqli-arrow)"></path><path d="M281 160V216" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#sqli-arrow)"></path><path d="M198 272V312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#sqli-arrow)"></path></g><g><rect x="40" y="216" width="316" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="198" y="240" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1つのSQL文につなげる</text><text x="198" y="258" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">入力の記号が命令の一部として解釈される</text></g><g><rect x="40" y="312" width="316" height="56" rx="8" fill="var(--cds-chart-status-critical)" fill-opacity="0.12" stroke="var(--cds-chart-status-critical)" stroke-width="2"></rect><text x="198" y="336" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データベース</text><text x="198" y="354" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">条件が書き換わった命令を実行してしまう</text></g></g><g><rect x="388" y="60" width="348" height="324" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-grid)" stroke-width="1"></rect><text x="404" y="88" font-size="14" font-weight="600" fill="var(--cds-text-primary)">安全：プレースホルダーを使う</text><g><rect x="404" y="104" width="150" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="479" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">命令のひな形</text><text x="479" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">値の場所は ? で示す</text></g><g><rect x="570" y="104" width="150" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="645" y="128" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">利用者の入力</text><text x="645" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">細工された文字列</text></g><g><path d="M479 160V312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#sqli-arrow)"></path><path d="M645 160V312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#sqli-arrow)"></path></g><text font-size="11.5" fill="var(--cds-text-secondary)"><tspan x="489" y="236">①命令の形を</tspan><tspan x="489" y="252">先に確定</tspan></text><text font-size="11.5" fill="var(--cds-text-secondary)"><tspan x="655" y="236">②値として</tspan><tspan x="655" y="252">別に渡す</tspan></text><g><rect x="404" y="312" width="316" height="56" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="562" y="336" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データベース</text><text x="562" y="354" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">入力はどんな記号でもただの値として扱う</text></g></g></svg>
