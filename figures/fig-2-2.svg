<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="半加算器は、XORとANDの2つの回路で1桁の足し算をする" font-size="13"><style>svg:root{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--cds-text-primary:#17201d;--cds-text-secondary:#4b5954;--cds-chart-axis:#7c8a84;--cds-chart-grid:#dbe3df;--cds-chart-reference-tint:#e8efec;--cds-chart-categorical-1:#13795b;--cds-chart-categorical-2:#2f6fb0;--cds-chart-categorical-3:#b4691a;--cds-chart-status-good:#1e8a4f;--cds-chart-status-warning:#b7791f;--cds-chart-status-critical:#c2412d;background:#fff}</style><defs><marker id="f22-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">半加算器は、XORとANDの2つの回路で1桁の足し算をする</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">入力AとBを両方の回路に入れると、その桁の和Sと、上の桁への繰り上がりCが出てくる</text><g><text x="40" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A</text><text x="40" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">B</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M60 116H230" marker-end="url(#f22-arrow)"></path><path d="M120 116V216H230" marker-end="url(#f22-arrow)"></path><path d="M60 236H230" marker-end="url(#f22-arrow)"></path><path d="M168 236V136H230" marker-end="url(#f22-arrow)"></path><path d="M392 126H438" marker-end="url(#f22-arrow)"></path><path d="M392 226H438" marker-end="url(#f22-arrow)"></path></g><circle cx="120" cy="116" r="3.5" fill="var(--cds-chart-axis)"></circle><circle cx="168" cy="236" r="3.5" fill="var(--cds-chart-axis)"></circle><g><rect x="232" y="96" width="160" height="60" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="312" y="123" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">XOR</text><text x="312" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">どちらか一方だけ1なら1</text></g><g><rect x="232" y="196" width="160" height="60" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="312" y="223" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">AND</text><text x="312" y="242" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">両方とも1なら1</text></g><g><text x="450" y="131" font-size="15" font-weight="600" fill="var(--cds-text-primary)">S</text><text x="468" y="131" font-size="11.5" fill="var(--cds-text-secondary)">その桁の和</text><text x="450" y="231" font-size="15" font-weight="600" fill="var(--cds-text-primary)">C</text><text x="468" y="231" font-size="11.5" fill="var(--cds-text-secondary)">繰り上がり</text></g><g><text x="648" y="92" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">A＋Bの結果を2桁「CS」で読む</text><text x="588" y="124" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">A</text><text x="628" y="124" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">B</text><text x="668" y="124" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">C</text><text x="708" y="124" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">S</text><line x1="564" x2="732" y1="134" y2="134" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><line x1="648" x2="648" y1="108" y2="250" stroke="var(--cds-chart-grid)"></line><rect x="564" y="228" width="168" height="26" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="588" y="162" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="628" y="162" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="668" y="162" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="708" y="162" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="588" y="190" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="628" y="190" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="668" y="190" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="708" y="190" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="588" y="218" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="628" y="218" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="668" y="218" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="708" y="218" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="588" y="246" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="628" y="246" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="668" y="246" text-anchor="middle" fill="var(--cds-text-primary)">1</text><text x="708" y="246" text-anchor="middle" fill="var(--cds-text-primary)">0</text><text x="648" y="276" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">1＋1＝10（2進数）</text></g></svg>
