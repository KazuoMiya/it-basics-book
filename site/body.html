<div class="app" id="app">
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">
      <span class="menu-icon" aria-hidden="true"></span><span class="menu-text">目次</span>
    </button>
    <a class="brand" href="#intro">{{TITLE}}</a>
    <span class="crumb" id="crumb"></span>
    <a class="lab-link" href="{{LAB_URL}}" target="_blank" rel="noopener">{{LAB_NAME}}</a>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="目次">
    <div class="search">
      <label class="sr-only" for="q">本文を検索</label>
      <input id="q" type="search" placeholder="本文を検索" autocomplete="off">
    </div>
    <a class="resume" id="resume" href="#" hidden></a>
    <div class="results" id="results" hidden></div>
    <ol class="toc" id="toc"></ol>
    <p class="side-note">PythonとSQLのコード例は、その場で実行できます。</p>
    <a class="lab-card" href="{{LAB_URL}}" target="_blank" rel="noopener">
      <span class="lab-card-title">質問とトレーニングは{{LAB_NAME}}で</span>
      <span class="lab-card-text">本書の内容についての質問への回答や、手を動かして身につけるトレーニングは、{{LAB_NAME}}で受け付けています。</span>
    </a>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <article class="page" id="page"></article>
    <nav class="pager" id="pager" aria-label="前後の章"></nav>
  </main>
</div>

<!--TEMPLATES-->

<script>/*DATA*/</script>
<script>/*APP*/</script>
